name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: check / fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --exclude timsrust-sdk

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude timsrust-sdk -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --exclude timsrust-sdk

      - name: File sizes
        run: find crates clis python -name '*.rs' | xargs wc -l | sort -nr