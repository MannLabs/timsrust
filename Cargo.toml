[workspace]
members = [
    "clis/*",
    "crates/*",
    "python/*",
]
resolver = "3"

[workspace.lints.rust]
unnameable_types = "deny"
unreachable_pub = "warn"
# collapsible_if = "allow"

[workspace.dependencies]
# crates
filemanager = { path = "crates/filemanager", default-features = false }
timsrust = { path = "crates/timsrust", default-features = false }
timsrust-centroid = { path = "crates/timsrust-centroid", default-features = false }
timsrust-core = { path = "crates/timsrust-core", default-features = false }
timsrust-mgf = { path = "crates/timsrust-mgf", default-features = false }
timsrust-minitdf = { path = "crates/timsrust-minitdf", default-features = false }
timsrust-parquet-spectra = { path = "crates/timsrust-parquet-spectra", default-features = false }
timsrust-sdk = { path = "crates/timsrust-sdk", default-features = false }
timsrust-tdf = { path = "crates/timsrust-tdf", default-features = false }
timsrust-tsf = { path = "crates/timsrust-tsf", default-features = false }
timsrust-utils = { path = "crates/timsrust-utils", default-features = false }
timsrust-external = { path = "crates/timsrust-external", default-features = false }
# clis
timsrust-cli-core = { path = "clis/timsrust-cli-core", default-features = false }
# external
arrow = { version = "57", default-features = false }
bytemuck = { version = "1", default-features = false }
object_store = { version = "0.11", default-features = false }
url = { version = "2", default-features = false }
bytes = { version = "1", default-features = false }
clap = { version = "4" } # WARNING
env_logger = { version = "0.11", default-features = false }
indicatif = { version = "0.17", default-features = false }
libc = { version = "0.2", default-features = false }
linreg = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
lzf = { version = "1", default-features = false }
memmap2 = { version = "0.9", default-features = false }
parquet = { version = "57", default-features = false }
pyo3 = { version = "0.26", default-features = false}
rayon = { version = "1", default-features = false }
rusqlite = { version = "0.35", default-features = false }
tempfile = { version = "3", default-features = false }
thiserror = { version = "2" } # WARNING
futures = { version = "0.3", default-features = false }
xxhash-rust = { version = "0.8", default-features = false }
tokio = { version = "1", default-features = false }
zstd = { version = "0.13", default-features = false }
serde = { version = "1", default-features = false }
serde_arrow = { version = "0.13", default-features = false }
rustc-hash = { version = "2", default-features = false }
serde_json = { version = "1", default-features = false }

[profile.dev]
lto = "off"
codegen-units = 256
panic = "abort"
incremental = true
debug = false
opt-level = 3

[profile.test]
lto = "off"
codegen-units = 256
panic = "abort"
incremental = true
debug = false
opt-level = 3
